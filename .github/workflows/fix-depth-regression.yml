name: Fix depth blur regression

on:
  push:
    branches: [agent/npu-restoration-59]
    paths:
      - '.github/workflows/fix-depth-regression.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/npu-restoration-59
          fetch-depth: 0
      - name: Preserve limited cross-depth blur contribution
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/editor-depth-effects.js')
          text = path.read_text(encoding='utf-8')
          old = "    const weight = mask[pixel] * (1 + Math.max(0, luminance - 0.65) * 2.8 * bokeh);"
          new = "    const weight = Math.max(0.04, mask[pixel]) * (1 + Math.max(0, luminance - 0.65) * 2.8 * bokeh);"
          if old not in text:
              raise SystemExit('Nie znaleziono oczekiwanej formuły depth blur.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run regression tests
        run: |
          node --test tests/editor-depth.test.mjs tests/editor-retouch.test.mjs
          node --check src/editor-depth-effects.js
      - name: Commit focused fix
        run: |
          rm .github/workflows/fix-depth-regression.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editor-depth-effects.js .github/workflows/fix-depth-regression.yml
          git commit -m "Napraw regresję Lens Blur"
          git push origin HEAD:agent/npu-restoration-59
