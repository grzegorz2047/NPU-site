name: Editor core

on:
  pull_request:
    paths:
      - 'editor.html'
      - 'editor-*.css'
      - 'sw.js'
      - 'src/editor-*.js'
      - 'src/search-core.js'
      - 'src/conversation-answer.js'
      - 'src/contract-review.js'
      - 'src/document-locations.js'
      - 'tests/editor-*.test.mjs'
      - 'tests/search-core.test.mjs'
      - 'package.json'
      - '.github/workflows/editor-core.yml'
  push:
    branches: [main]
    paths:
      - 'editor.html'
      - 'editor-*.css'
      - 'sw.js'
      - 'src/editor-*.js'
      - 'src/search-core.js'
      - 'src/conversation-answer.js'
      - 'src/contract-review.js'
      - 'src/document-locations.js'
      - 'tests/editor-*.test.mjs'
      - 'tests/search-core.test.mjs'
      - 'package.json'
      - '.github/workflows/editor-core.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check editor module syntax
        run: |
          for file in src/editor-*.js; do
            node --check "$file"
          done
