name: Editor core

on:
  pull_request:
    paths:
      - 'editor.html'
      - 'editor-*.css'
      - 'sw.js'
      - 'src/editor-*.js'
      - 'src/search-core.js'
      - 'src/conversation-answer.js'
      - 'src/contract-review.js'
      - 'src/document-locations.js'
      - 'tests/editor-*.test.mjs'
      - 'tests/search-core.test.mjs'
      - 'package.json'
      - '.github/workflows/editor-core.yml'
  push:
    branches: [main]
    paths:
      - 'editor.html'
      - 'editor-*.css'
      - 'sw.js'
      - 'src/editor-*.js'
      - 'src/search-core.js'
      - 'src/conversation-answer.js'
      - 'src/contract-review.js'
      - 'src/document-locations.js'
      - 'tests/editor-*.test.mjs'
      - 'tests/search-core.test.mjs'
      - 'package.json'
      - '.github/workflows/editor-core.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Check editor module syntax
        run: |
          for file in src/editor-*.js; do
            node --check "$file"
          done
      - name: Validate service worker shell
        run: |
          node --check sw.js
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync } from 'node:fs';
          const source = readFileSync('sw.js', 'utf8');
          const paths = [...source.matchAll(/'\.\/([^']*)'/g)].map(match => match[1]);
          const missing = paths.filter(path => path && !existsSync(path));
          if (missing.length) {
            console.error(`Brak plików offline shell: ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Offline shell: ${paths.length} ścieżek, brak brakujących plików.`);
          NODE
