name: Fix Smart Select and retouch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-smart-select-model-ids
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply targeted fixes and regression tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          smart = Path('src/editor-smart-select-engine.js')
          text = smart.read_text()
          replacements = {
              "version: 'onnx-community-main-2026-07',\n    repository: 'onnx-community/segformer-b0-finetuned-ade-512-512'": "version: 'xenova-main-2026-07-fix1',\n    repository: 'Xenova/segformer-b0-finetuned-ade-512-512'",
              "version: 'onnx-community-main-2026-07',\n    repository: 'onnx-community/detr-resnet-50'": "version: 'xenova-main-2026-07-fix1',\n    repository: 'Xenova/detr-resnet-50'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing Smart Select pattern: {old}')
              text = text.replace(old, new, 1)
          smart.write_text(text)

          retouch = Path('src/editor-retouch-ui.js')
          text = retouch.read_text()
          old = 'const point = this.canvasController.viewport.clientToDocument(event.clientX, event.clientY);'
          new = 'const point = this.canvasController.eventDocumentPoint(event);'
          if old not in text:
              raise SystemExit('Missing retouch coordinate pattern')
          retouch.write_text(text.replace(old, new, 1))

          smart_test = Path('tests/editor-smart-select.test.mjs')
          text = smart_test.read_text()
          anchor = "  assert.equal(registry.get(SMART_DETECTION_MODEL_ID).task, 'object-detection');\n"
          addition = (
              anchor
              + "  assert.equal(registry.get(SMART_SEGMENTATION_MODEL_ID).repository, 'Xenova/segformer-b0-finetuned-ade-512-512');\n"
              + "  assert.equal(registry.get(SMART_DETECTION_MODEL_ID).repository, 'Xenova/detr-resnet-50');\n"
          )
          if anchor not in text:
              raise SystemExit('Missing Smart Select test anchor')
          smart_test.write_text(text.replace(anchor, addition, 1))

          retouch_test = Path('tests/editor-retouch.test.mjs')
          text = retouch_test.read_text()
          import_anchor = "import { RetouchProcessor } from '../src/editor-retouch-processor.js';\n"
          if import_anchor not in text:
              raise SystemExit('Missing retouch import anchor')
          text = text.replace(import_anchor, import_anchor + "import { RetouchController } from '../src/editor-retouch-ui.js';\n", 1)
          test_anchor = "function image(width, height, pixel) {\n"
          regression = """test('retouch maps pointer events through the CanvasController coordinate API', () => {
  const events = [];
  const result = RetouchController.prototype.point.call({
    canvasController: {
      eventDocumentPoint(event) {
        events.push(event);
        return { x: 12.5, y: -2 };
      }
    },
    documentModel: { width: 10, height: 8 }
  }, { clientX: 100, clientY: 200, pressure: 0.4 });
  assert.deepEqual(result, { x: 9, y: 0, pressure: 0.4 });
  assert.equal(events.length, 1);
});

"""
          if test_anchor not in text:
              raise SystemExit('Missing retouch test anchor')
          retouch_test.write_text(text.replace(test_anchor, regression + test_anchor, 1))
          PY
      - name: Run tests and syntax checks
        run: |
          npm test
          node --check src/editor-smart-select-engine.js
          node --check src/editor-retouch-ui.js
      - name: Commit fixes
        run: |
          rm .github/workflows/fix-smart-select-retouch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/editor-smart-select-engine.js src/editor-retouch-ui.js tests/editor-smart-select.test.mjs tests/editor-retouch.test.mjs .github/workflows/fix-smart-select-retouch.yml
          git commit -m "Napraw modele Smart Select i współrzędne retuszu"
          git push origin HEAD:agent/fix-smart-select-model-ids
